services:
  game:
    image: craft-ones-game:${RELEASE_TAG:-local}
    build:
      context: .
      target: game
    environment:
      NODE_ENV: production
      DISCORD_APPLICATIONS: ${DISCORD_APPLICATIONS:-}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a private metrics token}
      TRUST_PROXY_HOPS: "1"
      MAX_ROOMS: ${MAX_ROOMS:-10}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-20}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-16}
      CREATE_PER_MINUTE: ${CREATE_PER_MINUTE:-10}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
  web:
    image: craft-ones-web:${RELEASE_TAG:-local}
    build:
      context: .
      target: web
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
  proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set the public hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      game:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
volumes:
  caddy_data:
  caddy_config:
