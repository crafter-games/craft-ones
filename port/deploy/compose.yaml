# craft-ones: the game at / and the netplay relay at /relay on the same host. In Dokploy, point the domain's
# / at service web (port 80) and /relay at service relay (port 8787).
services:
  web:
    build:
      context: ../..
      dockerfile: port/deploy/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    environment:
      PORT: "8787"
    expose:
      - "8787"
