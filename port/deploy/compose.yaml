# craft-ones: the game at / and the netplay relay at /relay on the same host. In Dokploy, point the domain's
# / at service web (port 80) and /relay at service relay (port 8787). The token service is internal: web forwards
# /api/token to it. Set DISCORD_CLIENT_ID and DISCORD_CLIENT_SECRET in the compose environment.
services:
  web:
    build:
      context: ../..
      dockerfile: port/deploy/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    environment:
      PORT: "8787"
    expose:
      - "8787"
  token:
    build:
      context: .
      dockerfile: Dockerfile.token
    restart: unless-stopped
    environment:
      PORT: "8788"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    expose:
      - "8788"
