# The landing page at /, the game at /play/ (its bundle is content-hashed), terms and privacy as static pages.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # HTML is never cached: Discord caches aggressively and the game's index names the current bundle.
  location ~ \.html$ { add_header Cache-Control "no-cache"; }
  location = /play { return 301 /play/$is_args$args; }
  location /play/ { try_files $uri $uri/ /play/index.html; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(png|mp3|js|json|css|woff2|webp|jpg|ico)$ { expires 7d; add_header Cache-Control "public"; }
}
