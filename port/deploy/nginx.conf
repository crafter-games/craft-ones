server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # The bundle name is content-hashed; index.html must never be cached (Discord caches aggressively).
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(png|mp3|js|json)$ { expires 7d; add_header Cache-Control "public"; }
}
