# The landing page at /, the game at /play/ (its bundle is content-hashed), terms and privacy as static pages.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # HTML is never cached: Discord caches aggressively and the game's index names the current bundle.
  location ~ \.html$ { add_header Cache-Control "no-cache"; }
  location = /play { return 301 /play/$is_args$args; }
  location /play/ { try_files $uri $uri/ /play/index.html; }
  # Discord launches the Activity at /?frame_id=...: serve the game in place. A client-side redirect would make
  # document.referrer the landing, and the Discord SDK posts its handshake to that origin instead of Discord's.
  location = / {
    if ($arg_frame_id) { rewrite ^ /play/index.html last; }
    try_files /index.html =404;
  }
  # Discord Activities may only call their own host, so avatars and the sign-in code exchange go through here.
  # Only avatar images are forwarded to the Discord CDN, as PNG.
  location ~ ^/cdn/(avatars/[0-9]+/[A-Za-z0-9_]+\.png|embed/avatars/[0-9]\.png)$ {
    resolver 127.0.0.11;
    set $discord_cdn "https://cdn.discordapp.com/$1$is_args$args";
    proxy_pass $discord_cdn;
    proxy_ssl_server_name on;
    proxy_set_header Host cdn.discordapp.com;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /api/token {
    resolver 127.0.0.11;
    set $token_service http://token:8788;
    proxy_pass $token_service;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(png|mp3|js|json|css|woff2|webp|jpg|ico)$ { expires 7d; add_header Cache-Control "public"; }
}
