services:
  game:
    build:
      context: .
      target: game
    environment:
      NODE_ENV: production
      WEB_ORIGIN: https://craft-ones.crafter.run
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a private metrics token}
      TRUST_PROXY_HOPS: "1"
      MAX_ROOMS: "10"
      MAX_CONNECTIONS: "20"
      MAX_CONNECTIONS_PER_IP: "16"
      CREATE_PER_MINUTE: "10"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 2
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
  monitor:
    image: node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
    user: node
    command: [node, /monitor.mjs]
    volumes:
      - ./scripts/monitor.mjs:/monitor.mjs:ro
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a private metrics token}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      game:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, node, -e, "process.exit(Date.now()-require('node:fs').statSync('/tmp/heartbeat').mtimeMs<90000?0:1)"]
      interval: 30s
      timeout: 3s
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
