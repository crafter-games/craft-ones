name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    name: Milestone convergence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # The game server runs under Node via tsx, and Playwright starts it as a
      # web server, so the runner needs Node 22+ alongside Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Install browser runtime
        run: bunx playwright install --with-deps chromium

      # Runs bun test, typecheck, lint, build and test:e2e, then checks every
      # milestone acceptance criterion against the test that backs it. Exits 1
      # on failure or broken evidence and 2 if any gate was skipped, which on a
      # clean runner should never happen: nothing holds localhost:3000 and
      # chromium is installed above.
      - name: Converge
        run: bun scripts/converge.ts

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
