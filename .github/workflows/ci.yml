name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Tests, types and replays
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install
        run: bun install --frozen-lockfile && (cd port && bun install --frozen-lockfile)
      - name: Engine tests
        run: bun test
      - name: Types
        run: bun run typecheck
      - name: Port tests and golden replays
        run: cd port && bun run test
      - name: Netplay desync
        run: cd port && bunx dotframe desync --latency 474ms --jitter 40ms --delay 10 --frames 3000 --mash 3
